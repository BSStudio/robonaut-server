services:
  app:
    build: ./
    environment:
      robonauth.api-key: BSS
      spring.mongodb.host: mongo
      spring.rabbitmq.host: rabbitmq
    profiles:
      - app
    ports:
    - "127.0.0.1:8080:8080"
    # healthcheck: defined by the image's HEALTHCHECK (the distroless image has no wget)
  rabbitmq:
    image: "rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1"
    ports:
    - "127.0.0.1:5672:5672"
    - "127.0.0.1:15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 40s
  mongo:
    image: "mongo:9.0.4@sha256:dc28ed5a9d0fc616903c3f463bb1e53b92b49f441721b91926e87d90bf957ce8"
    environment:
      # Workaround for https://jira.mongodb.org/browse/SERVER-121912
      # mongod refuses to start on Linux kernels 6.19 - 7.0.13 (e.g. the ubuntu-26.04
      # GitHub runners ship 7.0.0) because its bundled TCMalloc's per-CPU caches rely on
      # restartable sequences (rseq), which those kernels broke. Keeping glibc's rseq
      # registration on makes TCMalloc fall back to per-thread caches so mongod boots,
      # at a small allocator performance cost that is irrelevant for dev/CI.
      # Remove once the runner kernel is >= 7.0.14 (fixed by SERVER-125742).
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
    - "127.0.0.1:27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
